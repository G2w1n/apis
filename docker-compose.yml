# Levanta PostgreSQL (para Django y Rails) con un solo comando:  docker compose up -d
# Firestore se ejecuta con el emulador de Firebase (ver node-firebase/README.md).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/crear-bases.sql:/docker-entrypoint-initdb.d/crear-bases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
