name: Pruebas de contrato

# Las 3 APIs deben pasar exactamente las mismas pruebas (tests/contrato.test.js)
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  contrato:
    name: ${{ matrix.api }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [express-firebase, django, rails]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tienda_django
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # ---------- Express + Firebase (emulador de Firestore) ----------
      - if: matrix.api == 'express-firebase'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - if: matrix.api == 'express-firebase'
        name: Probar Express + Firestore
        working-directory: node-firebase
        run: |
          npm install -g firebase-tools
          npm ci --prefix functions
          firebase emulators:exec --only firestore --project demo-tienda '
            cd functions && npm run seed &&
            (npm start > /tmp/api.log 2>&1 &) &&
            for i in $(seq 1 30); do curl -sf localhost:3000/health && break; sleep 1; done &&
            cd ../.. && npm run test:express'

      # ---------- Django + PostgreSQL ----------
      - if: matrix.api == 'django'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: django/requirements.txt
      - if: matrix.api == 'django'
        name: Probar Django
        working-directory: django
        env:
          DJANGO_DEBUG: "false"
        run: |
          pip install -r requirements.txt
          python manage.py migrate --noinput
          python manage.py seed
          gunicorn tienda.wsgi -b 0.0.0.0:8000 -w 2 --threads 4 --daemon
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 1; done
          cd .. && npm run test:django

      # ---------- Rails + PostgreSQL ----------
      - if: matrix.api == 'rails'
        uses: ruby/setup-ruby@v1
        with:
          working-directory: rails
          bundler-cache: true
      - if: matrix.api == 'rails'
        name: Probar Rails
        working-directory: rails
        env:
          RAILS_ENV: production
          SECRET_KEY_BASE: solo-para-ci-${{ github.run_id }}
          WEB_CONCURRENCY: 2
        run: |
          bin/rails db:prepare
          bin/rails db:seed
          bin/rails server -p 3001 -d
          for i in $(seq 1 30); do curl -sf localhost:3001/health && break; sleep 1; done
          cd .. && npm run test:rails

  frontend:
    name: frontend (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Compilar Voltec
        working-directory: frontend
        run: npm ci && npm run build
