name: Pruebas de contrato

# La API Express + Firebase debe pasar las pruebas de contrato (tests/contrato.test.js)
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  contrato:
    name: express-firebase
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # ---------- Express + Firebase (emulador de Firestore) ----------
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Probar Express + Firestore
        working-directory: node-firebase
        run: |
          npm install -g firebase-tools
          npm ci --prefix functions
          firebase emulators:exec --only firestore --project demo-tienda '
            cd functions && npm run seed &&
            (npm start > /tmp/api.log 2>&1 &) &&
            for i in $(seq 1 30); do curl -sf localhost:3000/health && break; sleep 1; done &&
            cd ../.. && npm run test:express'

  frontend:
    name: frontend (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Compilar Voltec
        working-directory: frontend
        run: npm ci && npm run build
