# Blueprint de Render: crea las 3 APIs, el panel web y la base PostgreSQL con un solo clic.
# Render → New → Blueprint → conecta el repositorio G2w1n/apis.
# Todo usa el plan gratuito. Los servicios gratuitos "duermen" tras 15 min sin uso (la primera visita tarda ~1 min).

services:
  # ---------- Node.js + Express + Firebase Firestore ----------
  - type: web
    name: g2w1n-tienda-express
    runtime: node
    plan: free
    rootDir: node-firebase/functions
    buildCommand: npm ci
    startCommand: npm run start:nube
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      # Pega aquí TODO el contenido del JSON de la cuenta de servicio de Firebase (proyecto apip-e0b09)
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false

  # ---------- Django + PostgreSQL ----------
  - type: web
    name: g2w1n-tienda-django
    runtime: python
    plan: free
    rootDir: django
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && python manage.py seed --si-vacio && gunicorn tienda.wsgi -b 0.0.0.0:$PORT -w 2 --threads 4
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: g2w1n-tienda-db
          property: connectionString

  # ---------- Ruby on Rails + PostgreSQL ----------
  - type: web
    name: g2w1n-tienda-rails
    runtime: ruby
    plan: free
    rootDir: rails
    buildCommand: bundle install
    startCommand: bin/rails db:prepare && bin/rails tienda:seed_si_vacio && bundle exec puma -C config/puma.rb
    healthCheckPath: /health
    envVars:
      - key: RAILS_ENV
        value: production
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: WEB_CONCURRENCY
        value: "0"
      - key: RAILS_MAX_THREADS
        value: "5"
      - key: DATABASE_URL
        fromDatabase:
          name: g2w1n-tienda-db
          property: connectionString

  # ---------- Panel web (sitio estático) ----------
  - type: web
    name: g2w1n-tienda-panel
    runtime: static
    buildCommand: echo "Sitio estático, no requiere build"
    staticPublishPath: ./node-firebase/public

databases:
  # Django y Rails comparten esta base (el plan gratuito permite una); sus tablas no chocan:
  # Django usa el prefijo api_* y Rails tablas propias (productos, pedidos, ...).
  - name: g2w1n-tienda-db
    plan: free
    databaseName: tienda
    user: tienda
