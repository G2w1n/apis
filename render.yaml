# Blueprint de Render: crea la API (Express + Firebase), el panel web y la tienda Voltec con un solo clic.
# Render → New → Blueprint → conecta el repositorio G2w1n/apis.
# Todo usa el plan gratuito. Los servicios gratuitos "duermen" tras 15 min sin uso (la primera visita tarda ~1 min).

services:
  # ---------- Node.js + Express + Firebase Firestore ----------
  - type: web
    name: g2w1n-tienda-express
    runtime: node
    plan: free
    rootDir: node-firebase/functions
    buildCommand: npm ci
    startCommand: npm run start:nube
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      # Pega aquí TODO el contenido del JSON de la cuenta de servicio de Firebase (proyecto probandoapi-8c9b8)
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false

  # ---------- Panel web (sitio estático) ----------
  - type: web
    name: g2w1n-tienda-panel
    runtime: static
    buildCommand: echo "Sitio estático, no requiere build"
    staticPublishPath: ./node-firebase/public

  # ---------- Voltec: tienda en React (Vite) ----------
  - type: web
    name: g2w1n-voltec
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: NODE_VERSION
        value: "22"
    # Cabeceras de seguridad: el navegador solo ejecuta scripts propios, solo se conecta a nuestra API
    # y nadie puede incrustar la tienda en un iframe (clickjacking)
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://g2w1n-tienda-express.onrender.com https://fonts.googleapis.com https://fonts.gstatic.com; manifest-src 'self'; worker-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
    # React Router maneja las rutas en el navegador: cualquier URL (/catalogo, /admin...) sirve index.html
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

